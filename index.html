<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b42"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="SamaBudget"><meta name="description" content="Gère tes revenus, dépenses et budget mensuel en dollars canadiens."><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>SamaBudget</title><style>body{margin:0;background:#edf3f6;font:15px system-ui;color:#152b3d}.app{max-width:430px;margin:auto;min-height:100vh;background:#f7fafc}.head{background:#102b42;color:white;padding:26px 22px 30px;border-radius:0 0 28px 28px}.muted{opacity:.75;font-size:13px}.amount{font-size:35px;font-weight:750;margin:10px 0 18px}.stats{display:flex;gap:12px}.stat{flex:1;background:#ffffff19;padding:13px;border-radius:14px}.stat b{display:block;margin-top:5px;font-size:18px}main{padding:22px}h2{font-size:18px;margin:10px 0 15px}.budget,.item,.panel{background:white;border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #1832480b}.between{display:flex;justify-content:space-between;align-items:center}.bar{background:#e5ecf0;border-radius:20px;height:10px;margin-top:13px;overflow:hidden}.fill{height:100%;background:#20a88a;width:0%}.item{display:flex;gap:12px;align-items:center}.emoji{font-size:24px;background:#edf5f8;border-radius:12px;padding:10px}.grow{flex:1}.item small{display:block;color:#71818c;margin-top:4px}.negative{color:#e45c60}.positive{color:#149c77}.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16a889;color:white;border:0;border-radius:30px;padding:16px 27px;font-weight:bold;font-size:15px;box-shadow:0 8px 25px #16a88955}dialog{border:0;border-radius:22px;padding:22px;width:min(85vw,370px)}dialog::backdrop{background:#061d2b99}label{display:block;margin:12px 0 5px;font-weight:600}input,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d8e2e8;border-radius:10px;font-size:16px}.actions{display:flex;gap:10px;margin-top:20px}button{cursor:pointer}.actions button{flex:1;border:0;border-radius:12px;padding:13px;background:#16a889;color:white}.actions button:first-child{background:#e9eff2;color:#263b4a}.empty{color:#71818c;text-align:center;padding:24px}.tx-actions{display:flex;flex-direction:column;gap:5px}.tx-actions button{border:0;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:700}.tx-edit{background:#e1f5ef;color:#087c65}.tx-delete{background:#fff0f0;color:#b33139}.edit{border:0;background:transparent;color:#0b8e78;font-weight:bold}</style></head><body><div class="app"><header class="head"><div class="muted">Bonjour 👋 Bienvenue sur</div><h1 style="margin:4px 0 20px">SamaBudget</h1><div class="muted">Solde disponible</div><div class="amount" id="balance">0,00 $</div><div class="stats"><div class="stat"><span class="muted">↗ Revenus</span><b id="income">0,00 $</b></div><div class="stat"><span class="muted">↘ Dépenses</span><b id="expenses">0,00 $</b></div></div></header><main><div class="between"><h2>Budget du mois</h2><button class="edit" id="editBudget">Modifier</button></div><div class="budget"><div class="between"><strong id="spent">0,00 $ dépensés</strong><span id="limit">sur 1 500,00 $</span></div><div class="bar"><div class="fill" id="fill"></div></div><p class="muted" id="remaining"></p></div><h2>Transactions récentes</h2><div id="transactions"></div></main><button class="fab" id="add">＋ Ajouter une transaction</button></div><dialog id="transactionDialog"><form id="transactionForm"><h2 id="transactionTitle">Nouvelle transaction</h2><label for="type">Type</label><select id="type"><option value="expense">Dépense</option><option value="income">Revenu</option></select><label for="amount">Montant ($ CA)</label><input id="amount" type="number" min="0.01" step="0.01" required placeholder="Ex. 45,50"><label for="category">Catégorie</label><select id="category"><option>Alimentation</option><option>Logement</option><option>Transport</option><option>Factures</option><option>Loisirs</option><option>Santé</option><option>Salaire</option><option>Autre</option></select><label for="note">Description</label><input id="note" maxlength="80" placeholder="Ex. Épicerie"><div class="actions"><button type="button" id="cancel">Annuler</button><button type="submit" id="saveTransaction">Enregistrer</button></div></form></dialog><dialog id="budgetDialog"><form id="budgetForm"><h2>Budget mensuel</h2><label for="budgetInput">Montant ($ CA)</label><input id="budgetInput" type="number" min="1" step="0.01" required><div class="actions"><button type="button" id="cancelBudget">Annuler</button><button type="submit">Enregistrer</button></div></form></dialog><script>const key='samabudget-v1';let editingId=null;let state;try{state=JSON.parse(localStorage.getItem(key))||{budget:1500,transactions:[]}}catch{state={budget:1500,transactions:[]}}if(!Array.isArray(state.transactions))state.transactions=[];state.transactions.forEach((t,i)=>{if(!t.id)t.id='legacy-'+i+'-'+t.date});const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD'}).format(n),month=d=>new Date(d).toISOString().slice(0,7),current=new Date().toISOString().slice(0,7);function save(){localStorage.setItem(key,JSON.stringify(state));render()}function render(){let tx=state.transactions.filter(t=>t.date.slice(0,7)===current),inc=tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),exp=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);$('balance').textContent=fmt(inc-exp);$('income').textContent=fmt(inc);$('expenses').textContent=fmt(exp);$('spent').textContent=fmt(exp)+' dépensés';$('limit').textContent='sur '+fmt(state.budget);$('fill').style.width=Math.min(100,exp/state.budget*100)+'%';$('fill').style.background=exp>state.budget?'#e45c60':'#20a88a';$('remaining').textContent=exp>state.budget?'Budget dépassé de '+fmt(exp-state.budget):'Il reste '+fmt(state.budget-exp)+' dans ton budget';let el=$('transactions');el.replaceChildren();if(!tx.length){el.innerHTML='<div class="empty">Aucune transaction ce mois-ci.<p>Ajoute ton premier revenu ou ta première dépense.</p></div>';return}let icons={'Alimentation':'🛒','Logement':'🏠','Transport':'🚗','Factures':'🧾','Loisirs':'🎮','Santé':'💊','Salaire':'💼','Autre':'💳'};tx.slice().reverse().forEach(t=>{let row=document.createElement('div');row.className='item';let icon=document.createElement('div');icon.className='emoji';icon.textContent=icons[t.category]||'💳';let info=document.createElement('div');info.className='grow';let strong=document.createElement('strong');strong.textContent=t.note||t.category;let small=document.createElement('small');small.textContent=t.category+' · '+new Date(t.date).toLocaleDateString('fr-CA');info.append(strong,small);let value=document.createElement('b');value.className=t.type==='expense'?'negative':'positive';value.textContent=(t.type==='expense'?'− ':'+ ')+fmt(t.amount);let actions=document.createElement('div');actions.className='tx-actions';let edit=document.createElement('button');edit.type='button';edit.className='tx-edit';edit.textContent='Modifier';edit.setAttribute('aria-label','Modifier '+(t.note||t.category));edit.onclick=()=>openTransaction(t.id);let del=document.createElement('button');del.type='button';del.className='tx-delete';del.textContent='Supprimer';del.setAttribute('aria-label','Supprimer '+(t.note||t.category));del.onclick=()=>{if(confirm('Supprimer cette transaction de '+fmt(t.amount)+' ? Cette action est irréversible.')){state.transactions=state.transactions.filter(x=>x.id!==t.id);save()}};actions.append(edit,del);row.append(icon,info,value,actions);el.append(row)})}function openTransaction(id=null){editingId=id;const t=state.transactions.find(x=>x.id===id);$('transactionTitle').textContent=t?'Modifier la transaction':'Nouvelle transaction';$('saveTransaction').textContent=t?'Enregistrer les modifications':'Enregistrer';$('transactionForm').reset();if(t){$('type').value=t.type;$('amount').value=t.amount;$('category').value=t.category;$('note').value=t.note||''}$('transactionDialog').showModal()}$('add').onclick=()=>openTransaction();$('cancel').onclick=()=>$('transactionDialog').close();$('transactionForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<=0)return;const data={type:$('type').value,amount,category:$('category').value,note:$('note').value.trim()};if(editingId){const t=state.transactions.find(x=>x.id===editingId);if(t)Object.assign(t,data)}else{state.transactions.push({...data,id:globalThis.crypto?.randomUUID?.()||('tx-'+Date.now()+'-'+Math.random()),date:new Date().toISOString()})}save();editingId=null;e.target.reset();$('transactionDialog').close()};$('editBudget').onclick=()=>{$('budgetInput').value=state.budget;$('budgetDialog').showModal()};$('cancelBudget').onclick=()=>$('budgetDialog').close();$('budgetForm').onsubmit=e=>{e.preventDefault();state.budget=Number($('budgetInput').value);save();$('budgetDialog').close()};render();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}</script></body></html>
